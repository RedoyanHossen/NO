
<!DOCTYPE html>
<html>
<head>
  <title>No Thanks - পণ্য স্ক্যানার</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
  <h2>পণ্য স্ক্যান করুন</h2>
  <div id="reader" style="width:300px;"></div>
  <div id="result" style="font-size: 20px; margin-top: 20px;"></div>

  <script>
    const israelCodes = ["729"]; // 729 দিয়ে শুরু হলে ইসরায়েলি

    function checkCode(data) {
      const resultDiv = document.getElementById("result");
      if (israelCodes.some(prefix => data.startsWith(prefix))) {
        resultDiv.innerHTML = "<span style='color:red;'>No Thanks - ইসরায়েলি পণ্য</span>";
      } else {
        resultDiv.innerHTML = "<span style='color:green;'>এটি ইসরায়েলি নয়</span>";
      }
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      checkCode
    ).catch(err => {
      document.getElementById("result").innerText = "ক্যামেরা চালু হয়নি: " + err;
    });
  </script>
</body>
</html>
